<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Akses - Event Counter Wondrx</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      background-color: var(--color-bg, #FBF8F3);
      color: var(--color-text, #020002);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Decorative Gradient Blobs from DESIGN.md */
    .blob-orange {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(245, 145, 33, 0.15) 0%, rgba(251, 248, 243, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .blob-purple {
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(1, 113, 135, 0.12) 0%, rgba(251, 248, 243, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      z-index: 1;
    }

    .login-nav {
      background: var(--color-surface, #FFFFFF);
      border-radius: var(--radius-pill, 999px);
      padding: 12px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--color-border, #EAE5DD);
      margin-bottom: 24px;
    }

    .login-card {
      background: var(--color-surface, #FFFFFF);
      border-radius: var(--radius-card, 20px);
      border: 1px solid var(--color-border, #EAE5DD);
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    .badge-auth {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--color-surface, #FFFFFF);
      border: 1px solid var(--color-border, #EAE5DD);
      padding: 6px 16px;
      border-radius: var(--radius-pill, 999px);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text, #020002);
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #FF7200;
    }

    .login-headline {
      font-size: 32px;
      font-weight: 800;
      color: var(--color-text, #020002);
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .login-sub {
      font-size: 15px;
      color: var(--color-muted, #666666);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .google-btn-container {
      display: flex;
      justify-content: center;
      min-height: 44px;
      margin-bottom: 16px;
    }

    .auth-error-badge {
      color: var(--color-danger, #E11D48);
      background: #FFF1F2;
      border: 1px solid #FECDD3;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      display: none;
      margin-top: 16px;
      font-weight: 500;
    }

    .login-footer-text {
      font-size: 13px;
      color: var(--color-muted, #666666);
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <!-- Ambient blobs from DESIGN.md -->
  <div class="blob-orange"></div>
  <div class="blob-purple"></div>

  <div class="login-container">
    <!-- Navbar Pill -->
    <nav class="login-nav">
      <div class="brand-wrapper">
        <img src="assets/logo.png" alt="BNI wondrX Logo" class="brand-logo" style="height:32px; max-height:32px; width:auto; object-fit:contain;">
        <div class="brand-divider"></div>
        <span class="brand-title" style="font-weight: 700;">Event Counter Wondrx</span>
      </div>
    </nav>

    <!-- Main Login Card -->
    <div class="login-card">
      <div class="badge-auth">
        <span class="badge-dot"></span> OTENTIKASI PENGUNJUNG
      </div>



      <h1 class="login-headline">Akses Dashboard Terproteksi</h1>
      <p class="login-sub">Silakan login menggunakan akun Google Anda yang terdaftar dalam sistem untuk melanjutkan.</p>

      <div class="google-btn-container">
        <div id="g_id_signin"></div>
      </div>

      <div id="auth-error" class="auth-error-badge"></div>

      <div class="login-footer-text">
        Dikelola oleh sistem &bull; Google OAuth 2.0 Whitelist
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>

</html>
